:root{--bg:#EDF0EF;--panel:#FFF;--ink:#1B2730;--muted:#5A6870;--line:#D3DAD8;--accent:#2F5D62;--seal:#B3261E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131A1D;--panel:#1B2428;--ink:#E3E9EB;--muted:#98A6AD;--line:#2D3A40;--accent:#7FB3B5;--seal:#F0897F}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;line-height:1.6;display:flex;flex-direction:column;align-items:center;padding:40px 20px}
.seal{width:56px;height:56px;display:grid;place-items:center;border:3px solid var(--seal);color:var(--seal);border-radius:8px;font-weight:700;font-size:30px;transform:rotate(-5deg);margin-bottom:14px}
h1{font-size:22px;margin:0 0 6px;text-align:center}
p.sub{color:var(--muted);margin:0 0 28px;text-align:center;max-width:52ch;font-size:14.5px}
.tools{display:grid;gap:16px;width:100%;max-width:760px}
a.tool{display:block;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 22px;text-decoration:none;color:inherit}
a.tool:hover{border-color:var(--accent)}
a.tool h2{margin:0 0 6px;font-size:18px;color:var(--accent)}
a.tool p{margin:0;color:var(--muted);font-size:14px}
footer{margin-top:30px;color:var(--muted);font-size:13px;text-align:center;max-width:56ch}
</style>
